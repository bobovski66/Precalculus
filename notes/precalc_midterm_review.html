<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Precalculus I &mdash; Master Review, Weeks 1&ndash;5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF7F0;
  --card:#FFFFFF;
  --ink:#22252B;
  --faint:#6B6F78;
  --rule:#E2DDD2;
  --crimson:#8C2F39;
  --crimson-soft:#F3E4E5;
  --chap:#3E5C76;
  --chap-soft:#E7EDF3;
  --gold:#B08A3E;
  --green:#3E6B4F;
  --green-soft:#E4EEE7;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:17px}
body{
  font-family:'Crimson Pro',Georgia,serif;
  background:var(--paper);
  color:var(--ink);
  line-height:1.55;
  min-height:100vh;
  padding-bottom:4rem;
}
.wrap{max-width:820px;margin:0 auto;padding:0 1.1rem}

/* header */
header{border-bottom:3px double var(--rule);padding:2.2rem 0 1.3rem;margin-bottom:1.4rem}
.eyebrow{font-family:'DM Mono',monospace;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--crimson)}
h1{font-weight:700;font-size:2rem;line-height:1.15;margin:.3rem 0 .2rem}
.sub{color:var(--faint);font-size:1.02rem;font-style:italic}

/* chapter pills */
.pills{display:flex;flex-wrap:wrap;gap:.5rem;margin:1.1rem 0 .4rem}
.pill{
  font-family:'DM Mono',monospace;font-size:.78rem;letter-spacing:.02em;
  border:1.5px solid var(--chap);color:var(--chap);background:transparent;
  border-radius:999px;padding:.32rem .85rem;cursor:pointer;transition:all .15s;
  user-select:none;
}
.pill.on{background:var(--chap);color:#fff}
.pill:focus-visible{outline:2px solid var(--crimson);outline-offset:2px}
.pillnote{font-size:.85rem;color:var(--faint);font-style:italic;margin-bottom:1rem}

/* draw button row */
.drawrow{display:flex;align-items:center;gap:1rem;margin:.6rem 0 1.4rem;flex-wrap:wrap}
.btn{
  font-family:'DM Mono',monospace;font-size:.85rem;letter-spacing:.03em;
  border:none;border-radius:6px;padding:.6rem 1.2rem;cursor:pointer;transition:all .15s;
}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn-draw{background:var(--crimson);color:#fff}
.btn-draw:hover{background:#6f2530}
.btn-ghost{background:transparent;color:var(--crimson);border:1.5px solid var(--crimson)}
.btn-ghost:hover{background:var(--crimson-soft)}
.count{font-family:'DM Mono',monospace;font-size:.78rem;color:var(--faint)}

/* problem card */
.card{
  background:var(--card);border:1px solid var(--rule);border-radius:10px;
  padding:1.5rem 1.6rem 1.4rem;box-shadow:0 2px 10px rgba(34,37,43,.05);
  margin-bottom:1.2rem;
}
.cardhead{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin-bottom:.8rem;flex-wrap:wrap}
.chaptag{
  font-family:'DM Mono',monospace;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;
  background:var(--chap-soft);color:var(--chap);border-radius:4px;padding:.2rem .55rem;
}
.topic{font-style:italic;color:var(--faint);font-size:.92rem}
.qtext{font-size:1.08rem}
.qtext ol{margin:.5rem 0 0 1.4rem}
.qtext li{margin:.25rem 0}

/* solution */
.solwrap{margin-top:1.2rem;border-top:1px dashed var(--rule);padding-top:1rem}
.sol{
  background:var(--green-soft);border-left:4px solid var(--green);
  border-radius:0 8px 8px 0;padding:1rem 1.2rem;font-size:1.02rem;
  animation:reveal .25s ease-out;
}
@keyframes reveal{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.sol{animation:none}}
.sol .lbl{font-family:'DM Mono',monospace;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--green);display:block;margin-bottom:.4rem}
.sol p{margin:.35rem 0}
.sol ol{margin:.35rem 0 .35rem 1.3rem}
.sol li{margin:.25rem 0}

/* self-grade */
.grade{display:flex;gap:.6rem;align-items:center;margin-top:1rem;flex-wrap:wrap}
.grade span{font-style:italic;color:var(--faint);font-size:.92rem}
.btn-got{background:var(--green);color:#fff}
.btn-got:hover{filter:brightness(.9)}
.btn-miss{background:transparent;color:var(--crimson);border:1.5px solid var(--crimson)}
.btn-miss:hover{background:var(--crimson-soft)}

/* mastery strip */
.strip{margin-top:2rem}
.striphead{font-family:'DM Mono',monospace;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:.5rem}
.cells{display:grid;grid-template-columns:repeat(5,1fr);gap:.5rem}
.cell{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:.6rem .5rem;text-align:center}
.cell .cname{font-family:'DM Mono',monospace;font-size:.7rem;color:var(--chap);letter-spacing:.05em}
.cell .cscore{font-size:1.15rem;font-weight:600;margin-top:.15rem}
.cell .cscore .hit{color:var(--green)}
.cell .cscore .sep{color:var(--faint);font-weight:400}
.empty{color:var(--faint);font-style:italic;text-align:center;padding:2.5rem 1rem;border:1.5px dashed var(--rule);border-radius:10px;margin-bottom:1.2rem}

/* --- pure HTML/CSS math --- */
.m{font-family:'DM Mono',monospace;font-size:.93em;white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .12em;line-height:1.15}
.fr .n{border-bottom:1.4px solid currentColor;padding:0 .28em .05em}
.fr .d{padding:.05em .28em 0}
.rt{white-space:nowrap}
.rt .rad{border-top:1.4px solid currentColor;padding:0 .15em 0 .05em;margin-left:.05em}
sup,sub{font-size:.72em}
.pm{padding:0 .08em}

@media (max-width:560px){
  html{font-size:16px}
  .card{padding:1.2rem 1.1rem}
  .cells{grid-template-columns:repeat(5,1fr);gap:.35rem}
  .cell{padding:.45rem .25rem}
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="eyebrow">MATH&amp; 141 &middot; Precalculus I</div>
    <h1>Master Review: Weeks 1&ndash;5</h1>
    <div class="sub">Draw a random problem, work it on paper, then check your solution and grade yourself.</div>
  </div>
</header>

<main class="wrap">
  <div class="pills" id="pills" role="group" aria-label="Chapter filters"></div>
  <div class="pillnote">Toggle chapters on or off to focus the draw. All five are on to start.</div>

  <div class="drawrow">
    <button class="btn btn-draw" id="drawBtn">Draw a problem</button>
    <span class="count" id="deckCount"></span>
  </div>

  <div id="stage">
    <div class="empty">No problem drawn yet. Press <em>Draw a problem</em> to begin.</div>
  </div>

  <div class="strip">
    <div class="striphead">Session tally &mdash; got it / attempted</div>
    <div class="cells" id="cells"></div>
  </div>
</main>

<script>
/* ---------- tiny math markup helpers used inside problem strings ----------
   fr(n,d)  -> stacked fraction        rt(x) -> square root with vinculum
   cbrt(x)  -> cube root               m(x)  -> mono math span
--------------------------------------------------------------------------- */
const fr = (n,d)=>`<span class="fr"><span class="n">${n}</span><span class="d">${d}</span></span>`;
const rt = x=>`<span class="rt">&radic;<span class="rad">${x}</span></span>`;
const cbrt = x=>`<span class="rt"><sup>3</sup>&radic;<span class="rad">${x}</span></span>`;
const m = x=>`<span class="m">${x}</span>`;

const CH = {
  1:"Functions",
  2:"Lines &amp; Parabolas",
  3:"Polynomials",
  4:"Rational Functions",
  5:"Inverses &amp; Radicals"
};

/* ---------------------------- PROBLEM BANK ---------------------------- */
const BANK = [

/* ============================ WEEK 1 ============================ */
{ch:1, topic:"Relations, domain and range",
q:`For the relation ${m("{(&minus;1, 3), (0, 0), (2, 3), (2, &minus;3), (5, 1)}")}, state the domain and the range, and decide whether the relation is a function. Justify your answer.`,
s:`<p>Domain ${m("{&minus;1, 0, 2, 5}")}; range ${m("{3, 0, &minus;3, 1}")}.</p>
<p><strong>Not a function:</strong> the input ${m("2")} is paired with both ${m("3")} and ${m("&minus;3")}, so one input determines two outputs, violating the function condition.</p>`},

{ch:1, topic:"Vertical line test",
q:`Decide whether each graph could pass the vertical line test, and say what the test is checking:
<ol><li>a circle</li><li>a downward-opening parabola</li><li>the letter &ldquo;S&rdquo; lying on its back</li><li>a single steep upward line</li></ol>`,
s:`<ol>
<li>Circle: <strong>fails</strong> &mdash; a vertical line through its interior meets it twice.</li>
<li>Downward parabola: <strong>passes</strong> &mdash; every vertical line meets it once.</li>
<li>Sideways S: <strong>fails</strong> &mdash; some vertical lines meet it three times.</li>
<li>Steep line: <strong>passes</strong>.</li></ol>
<p>The test checks the defining property of a function: each input has exactly one output, since a vertical line collects all points sharing one ${m("x")}-value.</p>`},

{ch:1, topic:"Evaluating a function",
q:`Let ${m("f(x) = 2x<sup>2</sup> &minus; x + 3")}. Compute ${m("f(0)")}, ${m("f(&minus;2)")}, and ${m("f(t + 1)")}, simplifying the last completely.`,
s:`<p>${m("f(0) = 3")}.</p>
<p>${m("f(&minus;2) = 2(4) &minus; (&minus;2) + 3 = 8 + 2 + 3 = 13")}.</p>
<p>${m("f(t+1) = 2(t+1)<sup>2</sup> &minus; (t+1) + 3 = 2t<sup>2</sup> + 4t + 2 &minus; t &minus; 1 + 3 = 2t<sup>2</sup> + 3t + 4")}.</p>
<p>The input is the whole expression ${m("t + 1")}; parentheses protect it while the rule acts.</p>`},

{ch:1, topic:"Building a transformation",
q:`Starting from ${m("f(x) = x<sup>2</sup>")}, write the rule for the function obtained by shifting left 4, stretching vertically by 3, and shifting down 1. Then state the vertex.`,
s:`<p>Left 4 means ${m("h = &minus;4")}; vertical stretch 3 means ${m("A = 3")}; down 1 means ${m("k = &minus;1")}:</p>
<p>${m("g(x) = 3(x + 4)<sup>2</sup> &minus; 1")}.</p>
<p>The vertex of ${m("x<sup>2</sup>")} at the origin maps to ${m("(h, k) = (&minus;4, &minus;1)")}.</p>`},

{ch:1, topic:"Reading a transformation",
q:`Describe in words every transformation taking ${m("f(x) = |x|")} to ${m("g(x) = &minus;")}${fr("1","2")}${m("|x + 2| + 5")}, in the correct order, and give the coordinates of the corner of ${m("g")}.`,
s:`<p>Read ${m("A = &minus;")}${fr("1","2")}, ${m("h = &minus;2")}, ${m("k = 5")}. In order:</p>
<ol><li>shift left 2;</li><li>compress vertically by ${fr("1","2")} and reflect across the ${m("x")}-axis (since ${m("A &lt; 0")});</li><li>shift up 5.</li></ol>
<p>The corner of ${m("|x|")} at the origin lands at ${m("(&minus;2, 5)")}.</p>`},

{ch:1, topic:"Tracking a landmark point",
q:`The point ${m("(9, 3)")} lies on ${m("f(x) = ")}${rt("x")}. Find where it lands under ${m("g(x) = 2")}${rt("x &minus; 1")}${m(" + 4")} by tracking the coordinates through each step, then confirm by direct substitution.`,
s:`<p>The inside is ${m("x &minus; 1")}, so the parent's input 9 corresponds to ${m("g")}'s input ${m("9 + 1 = 10")}.</p>
<p>The output transforms by the outside: ${m("y: 3 &rarr; 2(3) + 4 = 10")}.</p>
<p>So ${m("(9, 3) &rarr; (10, 10)")}. Confirm: ${m("g(10) = 2")}${rt("9")}${m(" + 4 = 2(3) + 4 = 10")}. &check;</p>`},

{ch:1, topic:"Outside vs. inside",
q:`Explain, using the outside/inside rule, why ${m("f(x &minus; 3)")} shifts the graph <em>right</em> while ${m("f(x) + 3")} shifts it <em>up</em>. Why do the two &ldquo;+3&rdquo; moves go in such different directions?`,
s:`<p>Constants outside ${m("f")} act on the <em>output</em> and move the graph vertically as expected: ${m("f(x) + 3")} raises every output by 3.</p>
<p>Constants inside ${m("f")} act on the <em>input</em> before the function sees it, and run in reverse: ${m("f(x &minus; 3)")} reaches the parent's value at input 0 when ${m("x &minus; 3 = 0")}, i.e. at ${m("x = 3")}, so the graph shifts right.</p>
<p>One &ldquo;+3&rdquo; adjusts the output after the function acts; the other adjusts the input before it acts.</p>`},

{ch:1, topic:"Choosing a parent for a fit",
q:`A point cloud opens upward like a bowl with its lowest point near ${m("(2, &minus;3)")}. Propose a parent function and initial values of ${m("A, b, h, k")} to start a fit, and explain each choice.`,
s:`<p>A bowl suggests the parent ${m("f(x) = x<sup>2</sup>")}.</p>
<p>Start with ${m("A = 1")} (upward, unstretched), ${m("b = 1")}, ${m("h = 2")} (vertex ${m("x")}), ${m("k = &minus;3")} (vertex ${m("y")}).</p>
<p>The model's vertex then sits at ${m("(2, &minus;3)")}, matching the cloud's lowest point; ${m("A")} is tuned afterward to match how steeply the cloud rises.</p>`},

/* ============================ WEEK 2 ============================ */
{ch:2, topic:"Line through two points",
q:`Find the equation of the line through ${m("(&minus;1, 2)")} and ${m("(3, &minus;6)")}. Carry it through slope, point-slope, and slope-intercept form, and verify with both points.`,
s:`<p><strong>Slope.</strong> ${m("m = ")}${fr("&minus;6 &minus; 2","3 &minus; (&minus;1)")}${m(" = ")}${fr("&minus;8","4")}${m(" = &minus;2")}.</p>
<p><strong>Point-slope</strong> through ${m("(&minus;1, 2)")}: ${m("y &minus; 2 = &minus;2(x + 1)")}.</p>
<p><strong>Slope-intercept.</strong> ${m("y = &minus;2x &minus; 2 + 2 = &minus;2x")}, so ${m("f(x) = &minus;2x")}.</p>
<p>Check: ${m("f(&minus;1) = 2")} &check; and ${m("f(3) = &minus;6")} &check;.</p>`},

{ch:2, topic:"Point-slope and intercepts",
q:`A line passes through ${m("(4, 1)")} with slope ${m("&minus;")}${fr("2","3")}. Write its point-slope and slope-intercept forms, and find its ${m("x")}- and ${m("y")}-intercepts.`,
s:`<p>Point-slope: ${m("y &minus; 1 = &minus;")}${fr("2","3")}${m("(x &minus; 4)")}.</p>
<p>Slope-intercept: ${m("y = &minus;")}${fr("2","3")}${m("x + ")}${fr("8","3")}${m(" + 1 = &minus;")}${fr("2","3")}${m("x + ")}${fr("11","3")}.</p>
<p>The ${m("y")}-intercept is ${fr("11","3")}. The ${m("x")}-intercept solves ${m("0 = &minus;")}${fr("2","3")}${m("x + ")}${fr("11","3")}, giving ${m("x = ")}${fr("11","2")}.</p>`},

{ch:2, topic:"Which lines are functions?",
q:`Decide whether each relation is a function and, if so, give its slope:
<ol><li>the line through ${m("(2, 5)")} and ${m("(2, &minus;1)")}</li><li>the line through ${m("(0, 4)")} and ${m("(7, 4)")}</li><li>the line through ${m("(1, 1)")} and ${m("(3, 5)")}</li></ol>`,
s:`<ol>
<li>The run is 0, so the slope is undefined; this is the vertical line ${m("x = 2")}, <strong>not a function</strong>.</li>
<li>Slope 0, a function: the horizontal line ${m("y = 4")}.</li>
<li>Slope ${fr("5 &minus; 1","3 &minus; 1")}${m(" = 2")}, a function.</li></ol>`},

{ch:2, topic:"Fitting a parabola to three points",
q:`Find the quadratic ${m("f(x) = ax<sup>2</sup> + bx + c")} through ${m("(&minus;1, 6)")}, ${m("(0, 1)")}, and ${m("(2, 3)")} by setting up and solving the linear system.`,
s:`<p>From ${m("(0, 1)")}: ${m("c = 1")}. From ${m("(&minus;1, 6)")}: ${m("a &minus; b + 1 = 6")}, so ${m("a &minus; b = 5")}. From ${m("(2, 3)")}: ${m("4a + 2b + 1 = 3")}, so ${m("2a + b = 1")}.</p>
<p>Adding ${m("a &minus; b = 5")} and ${m("2a + b = 1")}: ${m("3a = 6")}, so ${m("a = 2")}, then ${m("b = &minus;3")}.</p>
<p>${m("f(x) = 2x<sup>2</sup> &minus; 3x + 1")}. Check ${m("(&minus;1)")}: ${m("2 + 3 + 1 = 6")} &check;.</p>`},

{ch:2, topic:"Completing the square",
q:`Convert ${m("f(x) = 3x<sup>2</sup> + 12x + 7")} to vertex form by completing the square, and confirm the vertex with the formula ${m("h = &minus;")}${fr("b","2a")}.`,
s:`<p>Factor 3 from the variable terms: ${m("3(x<sup>2</sup> + 4x) + 7")}. Half of 4, squared, is 4:</p>
<p>${m("3(x<sup>2</sup> + 4x + 4 &minus; 4) + 7 = 3(x + 2)<sup>2</sup> &minus; 12 + 7 = 3(x + 2)<sup>2</sup> &minus; 5")}.</p>
<p>The vertex is ${m("(&minus;2, &minus;5)")}. By formula, ${m("h = &minus;")}${fr("12","6")}${m(" = &minus;2")}, agreeing.</p>`},

{ch:2, topic:"Roots, vertex, intercept",
q:`For ${m("f(x) = x<sup>2</sup> &minus; 2x &minus; 15")}, find the roots by factoring, the vertex by averaging the roots, and the ${m("y")}-intercept. Describe the sketch with all three labeled.`,
s:`<p>Factor: ${m("(x &minus; 5)(x + 3)")}, roots ${m("5")} and ${m("&minus;3")}.</p>
<p>Axis of symmetry: ${m("x = ")}${fr("5 + (&minus;3)","2")}${m(" = 1")}. Vertex height: ${m("f(1) = 1 &minus; 2 &minus; 15 = &minus;16")}, so the vertex is ${m("(1, &minus;16)")}.</p>
<p>${m("y")}-intercept: ${m("f(0) = &minus;15")}.</p>
<p>Sketch: upward parabola crossing at ${m("&minus;3")} and ${m("5")}, vertex ${m("(1, &minus;16)")}, ${m("y")}-intercept ${m("(0, &minus;15)")}.</p>`},

{ch:2, topic:"The discriminant",
q:`Use the discriminant to determine the number of real roots of each; for any with real roots, give them:
<ol><li>${m("x<sup>2</sup> &minus; 4x + 4")}</li><li>${m("2x<sup>2</sup> + x + 3")}</li><li>${m("x<sup>2</sup> &minus; 5x + 2")}</li></ol>`,
s:`<ol>
<li>${m("16 &minus; 16 = 0")}: one (doubled) real root, ${m("x = 2")}.</li>
<li>${m("1 &minus; 24 = &minus;23 &lt; 0")}: no real roots.</li>
<li>${m("25 &minus; 8 = 17 &gt; 0")}: two real roots, ${m("x = ")}${fr("5 <span class='pm'>&plusmn;</span> &radic;17","2")}${m(" &asymp; 4.56")} and ${m("0.44")}.</li></ol>`},

{ch:2, topic:"Three forms of a quadratic",
q:`A quadratic has roots ${m("&minus;4")} and ${m("2")} and passes through ${m("(0, &minus;16)")}. Determine ${m("a")}, then write the function in all three forms.`,
s:`<p>${m("f(x) = a(x + 4)(x &minus; 2)")}. Then ${m("f(0) = a(4)(&minus;2) = &minus;8a = &minus;16")}, so ${m("a = 2")}.</p>
<p>Factored: ${m("2(x + 4)(x &minus; 2)")}. Standard: ${m("2x<sup>2</sup> + 4x &minus; 16")}.</p>
<p>Vertex: ${m("h = ")}${fr("&minus;4 + 2","2")}${m(" = &minus;1")}, ${m("k = f(&minus;1) = 2 &minus; 4 &minus; 16 = &minus;18")}, so ${m("2(x + 1)<sup>2</sup> &minus; 18")}.</p>`},

/* ============================ WEEK 3 ============================ */
{ch:3, topic:"End behavior",
q:`State the end behavior of each polynomial from its leading term alone:
<ol><li>${m("f(x) = 3x<sup>4</sup> &minus; x + 5")}</li><li>${m("f(x) = &minus;x<sup>3</sup> + 2x<sup>2</sup>")}</li><li>${m("f(x) = &minus;4x<sup>6</sup> + x<sup>5</sup>")}</li><li>${m("f(x) = x<sup>5</sup> &minus; 3x<sup>2</sup> + 1")}</li></ol>`,
s:`<ol>
<li>${m("3x<sup>4</sup>")}: even degree, positive lead &mdash; both ends up.</li>
<li>${m("&minus;x<sup>3</sup>")}: odd, negative lead &mdash; up on the left, down on the right.</li>
<li>${m("&minus;4x<sup>6</sup>")}: even, negative lead &mdash; both ends down.</li>
<li>${m("x<sup>5</sup>")}: odd, positive lead &mdash; down on the left, up on the right.</li></ol>`},

{ch:3, topic:"Roots and multiplicities",
q:`For ${m("f(x) = (x + 1)(x &minus; 2)<sup>3</sup>(x &minus; 4)")}, list the roots with their multiplicities, state the degree, and say at each root whether the graph crosses or touches.`,
s:`<p>Roots: ${m("&minus;1")} (multiplicity 1), ${m("2")} (multiplicity 3), ${m("4")} (multiplicity 1). Degree ${m("1 + 3 + 1 = 5")}.</p>
<p>The graph <strong>crosses</strong> at all three, since every multiplicity is odd; at ${m("x = 2")} the crossing flattens against the axis because the multiplicity is 3.</p>`},

{ch:3, topic:"Sign chart, simple roots",
q:`Build a complete sign chart for ${m("f(x) = (x + 3)(x &minus; 1)(x &minus; 2)")}, with a test point in each interval and the sign of every factor recorded.`,
s:`<p>Roots ${m("&minus;3, 1, 2")} split the line into four intervals. Testing ${m("x = &minus;4, 0, 1.5, 3")}:</p>
<ol>
<li>${m("(&minus;&infin;, &minus;3)")}: factors ${m("&minus;, &minus;, &minus;")} &rarr; ${m("f")} negative.</li>
<li>${m("(&minus;3, 1)")}: ${m("+, &minus;, &minus;")} &rarr; ${m("f")} positive.</li>
<li>${m("(1, 2)")}: ${m("+, +, &minus;")} &rarr; ${m("f")} negative.</li>
<li>${m("(2, &infin;)")}: ${m("+, +, +")} &rarr; ${m("f")} positive.</li></ol>
<p>The sign changes at each root, since all are simple.</p>`},

{ch:3, topic:"Sign chart with a double root",
q:`Build a sign chart for ${m("f(x) = &minus;(x + 1)<sup>2</sup>(x &minus; 3)")}. Identify where the sign does and does not change, and connect each to a multiplicity.`,
s:`<p>Roots: ${m("&minus;1")} (multiplicity 2), ${m("3")} (multiplicity 1).</p>
<p>${m("f")} is positive on ${m("(&minus;&infin;, &minus;1)")}, positive on ${m("(&minus;1, 3)")}, negative on ${m("(3, &infin;)")}.</p>
<p>No sign change at ${m("x = &minus;1")} (even multiplicity: a touch); a sign change at ${m("x = 3")} (odd multiplicity: a crossing). The leading ${m("&minus;1")} makes the overall lead negative.</p>`},

{ch:3, topic:"Full sketch from factored form",
q:`Sketch ${m("f(x) = (x &minus; 1)(x + 2)<sup>2</sup>")} from its factored form: state the ends, mark the roots with crossing or touching behavior, use the sign chart, and describe a shape consistent with all three.`,
s:`<p><strong>Ends.</strong> Degree 3, positive lead: down on the left, up on the right.</p>
<p><strong>Roots.</strong> Cross at ${m("1")} (simple), touch at ${m("&minus;2")} (double).</p>
<p><strong>Signs.</strong> Negative on ${m("(&minus;&infin;, &minus;2)")}, negative on ${m("(&minus;2, 1)")}, positive on ${m("(1, &infin;)")}.</p>
<p>The curve rises from the lower left, touches the axis at ${m("x = &minus;2")} and turns back down, continues below to cross up at ${m("x = 1")}, then climbs to the upper right.</p>`},

{ch:3, topic:"Lowest possible degree",
q:`A polynomial has even degree and negative leading coefficient, with simple roots at ${m("&minus;1")} and ${m("4")} and a double root at ${m("2")}. Determine the lowest possible degree, then describe a graph consistent with all stated features.`,
s:`<p>Multiplicities sum to at least ${m("1 + 1 + 2 = 4")}, so the lowest possible degree is <strong>4</strong> (even, consistent).</p>
<p>With negative lead, both ends point down. The curve comes up from the lower left, crosses at ${m("&minus;1")}, rises, touches at ${m("2")} and turns, crosses at ${m("4")}, and falls to the lower right.</p>`},

{ch:3, topic:"From sign pattern to factored form",
q:`A polynomial is positive on ${m("(&minus;&infin;, &minus;1)")}, negative on ${m("(&minus;1, 2)")}, and positive on ${m("(2, &infin;)")}, with no other sign changes. Determine the multiplicity parity at each of ${m("&minus;1")} and ${m("2")}, and give a possible factored form of lowest degree.`,
s:`<p>The sign changes at ${m("&minus;1")} (from ${m("+")} to ${m("&minus;")}) and at ${m("2")} (from ${m("&minus;")} to ${m("+")}), so both roots have <strong>odd multiplicity</strong>.</p>
<p>The lowest-degree form uses simple roots: ${m("f(x) = (x + 1)(x &minus; 2)")} (up to a positive constant); its sign pattern ${m("+, &minus;, +")} matches.</p>`},

/* ============================ WEEK 4 ============================ */
{ch:4, topic:"Zeros and vertical asymptotes",
q:`For ${m("f(x) = ")}${fr("(x &minus; 4)(x + 2)","(x &minus; 1)(x + 5)")}, state the zeros and the vertical asymptotes, and confirm there are no common factors.`,
s:`<p>Zeros at ${m("x = 4")} and ${m("x = &minus;2")} (numerator roots); vertical asymptotes at ${m("x = 1")} and ${m("x = &minus;5")} (denominator roots).</p>
<p>No factor is shared between numerator and denominator, so there are no holes and no cancellation.</p>`},

{ch:4, topic:"Holes vs. asymptotes",
q:`Identify the hole, the zeros, and the vertical asymptotes after reducing to lowest terms:
<p style="margin-top:.5rem">${m("f(x) = ")}${fr("(x &minus; 3)(x + 2)","(x + 2)(x &minus; 5)")}</p>`,
s:`<p>The factor ${m("(x + 2)")} is common, so it cancels, leaving ${fr("x &minus; 3","x &minus; 5")} with a <strong>hole at ${m("x = &minus;2")}</strong>.</p>
<p>The zero is ${m("x = 3")} and the vertical asymptote is ${m("x = 5")}.</p>`},

{ch:4, topic:"Horizontal asymptotes",
q:`Give the horizontal asymptote, if any, of each:
<ol><li>${fr("2x + 1","x &minus; 7")}</li><li>${fr("5x<sup>2</sup> &minus; 3","x<sup>2</sup> + 4")}</li><li>${fr("x + 6","x<sup>3</sup> &minus; 1")}</li><li>${fr("x<sup>3</sup>","x + 2")}</li></ol>`,
s:`<ol>
<li>Equal degrees: ${m("y = 2")}.</li>
<li>Equal degrees: ${m("y = 5")}.</li>
<li>Numerator degree below denominator: ${m("y = 0")}.</li>
<li>Numerator degree above denominator: no horizontal asymptote.</li></ol>`},

{ch:4, topic:"Full feature read",
q:`For ${m("f(x) = ")}${fr("6x<sup>2</sup> + x","3x<sup>2</sup> &minus; 12")}, find the horizontal asymptote from the leading coefficients, the zeros, and the vertical asymptotes.`,
s:`<p>Equal degrees, so ${m("y = ")}${fr("6","3")}${m(" = 2")}.</p>
<p>Zeros from ${m("x(6x + 1) = 0")}: ${m("x = 0")} and ${m("x = &minus;")}${fr("1","6")}.</p>
<p>Vertical asymptotes from ${m("3(x<sup>2</sup> &minus; 4) = 0")}: ${m("x = 2")} and ${m("x = &minus;2")}.</p>`},

{ch:4, topic:"Slant asymptote by long division",
q:`Use long division to write ${m("f(x) = ")}${fr("x<sup>2</sup> &minus; 5x + 6","x &minus; 1")} in the form ${m("Q(x) + ")}${fr("R","x &minus; 1")}, and state the slant asymptote.`,
s:`<p>Dividing ${m("x<sup>2</sup> &minus; 5x + 6")} by ${m("x &minus; 1")}: quotient ${m("x &minus; 4")}, remainder ${m("2")}, so</p>
<p>${m("f(x) = x &minus; 4 + ")}${fr("2","x &minus; 1")}.</p>
<p>The slant asymptote is ${m("y = x &minus; 4")}: the remainder term is proper and decays at the ends, so the graph hugs the quotient line.</p>`},

{ch:4, topic:"Slant asymptote, zeros, VA",
q:`Find the slant asymptote of ${m("f(x) = ")}${fr("2x<sup>2</sup> + 3x &minus; 1","x + 2")} by long division, and give the zeros and the vertical asymptote.`,
s:`<p>Dividing: quotient ${m("2x &minus; 1")}, remainder ${m("1")}, so the slant asymptote is ${m("y = 2x &minus; 1")}.</p>
<p>Vertical asymptote: ${m("x = &minus;2")}.</p>
<p>Zeros solve ${m("2x<sup>2</sup> + 3x &minus; 1 = 0")}: ${m("x = ")}${fr("&minus;3 <span class='pm'>&plusmn;</span> &radic;17","4")}${m(" &asymp; 0.28")} and ${m("&minus;1.78")}.</p>`},

{ch:4, topic:"Rational sign chart",
q:`Build a complete sign chart for ${m("f(x) = ")}${fr("x &minus; 1","(x + 2)(x &minus; 3)")} over its zeros and vertical asymptotes, recording the sign of each factor in each interval.`,
s:`<p>Feature points: zero at ${m("1")}, asymptotes at ${m("&minus;2")} and ${m("3")}. Testing ${m("x = &minus;3, 0, 2, 4")}:</p>
<ol>
<li>${m("(&minus;&infin;, &minus;2)")}: ${m("&minus;, &minus;, &minus;")} &rarr; ${m("f")} negative.</li>
<li>${m("(&minus;2, 1)")}: ${m("&minus;, +, &minus;")} &rarr; ${m("f")} positive.</li>
<li>${m("(1, 3)")}: ${m("+, +, &minus;")} &rarr; ${m("f")} negative.</li>
<li>${m("(3, &infin;)")}: ${m("+, +, +")} &rarr; ${m("f")} positive.</li></ol>
<p>Sign changes occur at the zero <em>and</em> beside each vertical asymptote.</p>`},

{ch:4, topic:"Constructing a rational function",
q:`A rational function has zeros at ${m("x = 0")} and ${m("x = 3")}, vertical asymptotes at ${m("x = &minus;1")} and ${m("x = 2")}, and a horizontal asymptote at ${m("y = 1")}. Construct a factored formula meeting all four conditions, and explain how you chose the degrees.`,
s:`<p>Zeros need numerator factors ${m("x(x &minus; 3)")}; asymptotes need denominator factors ${m("(x + 1)(x &minus; 2)")}.</p>
<p>The horizontal asymptote ${m("y = 1")} requires equal degrees with equal leading coefficients, which holds: both degree 2, lead 1. So</p>
<p>${m("f(x) = ")}${fr("x(x &minus; 3)","(x + 1)(x &minus; 2)")}.</p>`},

/* ============================ WEEK 5 ============================ */
{ch:5, topic:"Reading domains from formulas",
q:`State the domain of each:
<ol><li>${fr("x","x<sup>2</sup> &minus; 9")}</li><li>${rt("2x &minus; 6")}</li><li>${cbrt("x + 1")}</li><li>${fr("1",rt("x &minus; 4"))}</li></ol>`,
s:`<ol>
<li>All reals except ${m("x = <span class='pm'>&plusmn;</span>3")} (denominator roots).</li>
<li>Need ${m("2x &minus; 6 &ge; 0")}, so ${m("x &ge; 3")}.</li>
<li>All reals: an odd root accepts negatives.</li>
<li>Need ${m("x &minus; 4 &gt; 0")} strictly (to avoid both a negative radicand and a zero denominator), so ${m("x &gt; 4")}.</li></ol>`},

{ch:5, topic:"Ranges with reasons",
q:`Give the range of each, with a reason:
<ol><li>${m("f(x) = x<sup>2</sup> &minus; 4")}</li><li>${m("f(x) = ")}${rt("x")}${m(" + 2")}</li><li>${m("f(x) = &minus;|x|")}</li></ol>`,
s:`<ol>
<li>A square is ${m("&ge; 0")}, so the range is ${m("y &ge; &minus;4")}.</li>
<li>${rt("x")}${m(" &ge; 0")}, so the range is ${m("y &ge; 2")}.</li>
<li>${m("|x| &ge; 0")}, so ${m("&minus;|x| &le; 0")}; range ${m("y &le; 0")}.</li></ol>`},

{ch:5, topic:"Horizontal line test",
q:`Apply the horizontal line test to decide which are one-to-one:
<ol><li>${m("f(x) = 3x + 2")}</li><li>${m("f(x) = x<sup>2</sup> &minus; 1")}</li><li>${m("f(x) = x<sup>3</sup>")}</li><li>${m("f(x) = |x|")}</li></ol>`,
s:`<ol>
<li>Yes &mdash; a non-horizontal line is met once by every horizontal.</li>
<li>No &mdash; a horizontal line above the vertex meets it twice.</li>
<li>Yes.</li>
<li>No &mdash; the V is met twice by horizontals above the vertex.</li></ol>`},

{ch:5, topic:"Finding inverses",
q:`Find the inverse of each and state its domain:
<ol><li>${m("f(x) = 3x &minus; 7")}</li><li>${m("f(x) = ")}${fr("x + 2","5")}</li><li>${m("f(x) = x<sup>3</sup> + 1")}</li></ol>`,
s:`<ol>
<li>${m("f<sup>&minus;1</sup>(x) = ")}${fr("x + 7","3")}, domain all reals.</li>
<li>${m("f<sup>&minus;1</sup>(x) = 5x &minus; 2")}, domain all reals.</li>
<li>${m("f<sup>&minus;1</sup>(x) = ")}${cbrt("x &minus; 1")}, domain all reals.</li></ol>
<p>Each comes from writing ${m("y = f(x)")}, swapping ${m("x")} and ${m("y")}, and solving for ${m("y")}.</p>`},

{ch:5, topic:"Restricting to invert",
q:`For ${m("f(x) = x<sup>2</sup>")} restricted to ${m("x &ge; 0")}, find ${m("f<sup>&minus;1</sup>")}, verify ${m("f<sup>&minus;1</sup>(f(x)) = x")} on the restricted domain, and state the domain and range of ${m("f<sup>&minus;1</sup>")}.`,
s:`<p>The restriction makes ${m("f")} one-to-one, with inverse ${m("f<sup>&minus;1</sup>(x) = ")}${rt("x")}.</p>
<p>Check: ${m("f<sup>&minus;1</sup>(f(x)) = ")}${rt("x<sup>2</sup>")}${m(" = |x| = x")} for ${m("x &ge; 0")}.</p>
<p>The inverse has domain ${m("x &ge; 0")} (the range of ${m("f")}) and range ${m("y &ge; 0")} (the domain of ${m("f")}).</p>`},

{ch:5, topic:"Radical equation with a check",
q:`Solve and check, discarding any false solutions: ${m("&nbsp;")}${rt("2x + 3")}${m(" = x")}.`,
s:`<p>Square: ${m("2x + 3 = x<sup>2</sup>")}, so ${m("x<sup>2</sup> &minus; 2x &minus; 3 = 0")}, giving ${m("(x &minus; 3)(x + 1) = 0")}; candidates ${m("3")} and ${m("&minus;1")}.</p>
<p>Check: ${m("x = 3")} gives ${rt("9")}${m(" = 3")} &check;. ${m("x = &minus;1")} gives ${rt("1")}${m(" = 1 &ne; &minus;1")}, rejected &mdash; squaring forgot the sign.</p>
<p>Solution: ${m("x = 3")}.</p>`},

{ch:5, topic:"Radical equation with a check",
q:`Solve and check, discarding any false solutions: ${m("&nbsp;")}${rt("x + 7")}${m(" = x + 1")}.`,
s:`<p>Square: ${m("x + 7 = x<sup>2</sup> + 2x + 1")}, so ${m("x<sup>2</sup> + x &minus; 6 = 0")}, giving ${m("(x + 3)(x &minus; 2) = 0")}; candidates ${m("&minus;3")} and ${m("2")}.</p>
<p>Check: ${m("x = 2")} gives ${rt("9")}${m(" = 3 = 2 + 1")} &check;. ${m("x = &minus;3")} gives ${rt("4")}${m(" = 2 &ne; &minus;2")}, rejected.</p>
<p>Solution: ${m("x = 2")}.</p>`},

{ch:5, topic:"Transformed radical and its inverse",
q:`The function ${m("f(x) = ")}${rt("x &minus; 2")}${m(" + 1")} is built from the parent ${rt("x")} by transformations. State the domain and range, find the inverse, and confirm the domain of the inverse equals the range of ${m("f")}.`,
s:`<p>Domain: ${m("x &ge; 2")} (radicand ${m("&ge; 0")}). Range: ${m("y &ge; 1")} (the root is ${m("&ge; 0")}, shifted up 1).</p>
<p>Inverse: from ${m("y = ")}${rt("x &minus; 2")}${m(" + 1")}, swap and solve: ${m("x &minus; 1 = ")}${rt("y &minus; 2")}, so ${m("y = (x &minus; 1)<sup>2</sup> + 2")}, giving</p>
<p>${m("f<sup>&minus;1</sup>(x) = (x &minus; 1)<sup>2</sup> + 2")} with domain ${m("x &ge; 1")}.</p>
<p>The inverse's domain ${m("x &ge; 1")} equals the range of ${m("f")}, as required.</p>`},
];

/* ---------------------------- APP LOGIC ---------------------------- */
const activeCh = new Set([1,2,3,4,5]);
let deck = [];           // shuffled indices not yet drawn this cycle
let current = null;      // index into BANK
const tally = {1:{hit:0,tried:0},2:{hit:0,tried:0},3:{hit:0,tried:0},4:{hit:0,tried:0},5:{hit:0,tried:0}};

const pillsEl = document.getElementById('pills');
const stage = document.getElementById('stage');
const drawBtn = document.getElementById('drawBtn');
const deckCount = document.getElementById('deckCount');
const cellsEl = document.getElementById('cells');

function renderPills(){
  pillsEl.innerHTML = '';
  for(const c of [1,2,3,4,5]){
    const b = document.createElement('button');
    b.className = 'pill' + (activeCh.has(c) ? ' on' : '');
    b.setAttribute('aria-pressed', activeCh.has(c));
    b.innerHTML = `Wk ${c} &middot; ${CH[c]}`;
    b.onclick = ()=>{
      if(activeCh.has(c)){
        if(activeCh.size === 1) return;       // keep at least one chapter live
        activeCh.delete(c);
      } else activeCh.add(c);
      rebuildDeck();
      renderPills();
    };
    pillsEl.appendChild(b);
  }
}

function rebuildDeck(){
  deck = BANK.map((p,i)=>i).filter(i=>activeCh.has(BANK[i].ch));
  for(let i=deck.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [deck[i],deck[j]] = [deck[j],deck[i]];
  }
  updateCount();
}

function updateCount(){
  const total = BANK.filter(p=>activeCh.has(p.ch)).length;
  deckCount.textContent = `${deck.length} of ${total} remaining in this cycle`;
}

function draw(){
  if(deck.length === 0) rebuildDeck();      // reshuffle when the cycle is exhausted
  current = deck.pop();
  updateCount();
  renderProblem();
}

function renderProblem(){
  const p = BANK[current];
  stage.innerHTML = `
  <div class="card">
    <div class="cardhead">
      <span class="chaptag">Week ${p.ch} &middot; ${CH[p.ch]}</span>
      <span class="topic">${p.topic}</span>
    </div>
    <div class="qtext">${p.q}</div>
    <div class="solwrap">
      <button class="btn btn-ghost" id="showSol">Show solution</button>
      <div id="solBox"></div>
    </div>
  </div>`;
  document.getElementById('showSol').onclick = ()=>{
    document.getElementById('showSol').style.display = 'none';
    document.getElementById('solBox').innerHTML = `
      <div class="sol"><span class="lbl">Solution</span>${p.s}</div>
      <div class="grade">
        <span>How did it go?</span>
        <button class="btn btn-got" id="gGot">Got it</button>
        <button class="btn btn-miss" id="gMiss">Missed it</button>
      </div>`;
    document.getElementById('gGot').onclick = ()=>grade(true);
    document.getElementById('gMiss').onclick = ()=>grade(false);
  };
}

function grade(hit){
  const ch = BANK[current].ch;
  tally[ch].tried++;
  if(hit) tally[ch].hit++;
  renderCells();
  draw();                                    // roll straight into the next problem
}

function renderCells(){
  cellsEl.innerHTML = '';
  for(const c of [1,2,3,4,5]){
    const t = tally[c];
    const d = document.createElement('div');
    d.className = 'cell';
    d.innerHTML = `<div class="cname">Wk ${c}</div>
      <div class="cscore"><span class="hit">${t.hit}</span><span class="sep"> / ${t.tried}</span></div>`;
    cellsEl.appendChild(d);
  }
}

drawBtn.onclick = draw;
renderPills();
rebuildDeck();
renderCells();
</script>
