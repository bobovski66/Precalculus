<body><div class="loading"><h1>Week 2 Lab — Lines and Parabolas</h1><p>Loading the current course lab and preparing the guided student workspace…</p><p class="error" id="err"></p></div>
<script>
(async()=>{
 const SOURCE="https://raw.githubusercontent.com/bobovski66/Precalculus/main/labs/Precalc_Week2_Lab.html";
 const WEEK=2;
 const META={"title": "Lines and Parabolas", "big": "Equations are different coordinate descriptions of geometric objects. For lines, slope records a constant rate of change. For parabolas, changing algebraic form reveals different geometric information.", "questions": "As you work, ask which form makes the feature you need easiest to see: rate, intercept, root, axis, or vertex."};
 const GUIDES={"1": {"goal": "Build a line from two points and connect the slope calculation to constant rate of change.", "calc": "The slope is not merely a quotient to compute. It measures how much y changes for one unit of x, and the intercept anchors that constant rate to a specific line.", "notice": "If you choose a different pair of points on the same line, \\(\\text{rise}/\\text{run}\\) must be unchanged; similar triangles explain why."}, "2": {"goal": "Rewrite a quadratic so its vertex and opening are visible immediately.", "calc": "Completing the square does not change the function; it changes its coordinates from expanded form to vertex form. The reward is geometric information that was hidden in the coefficients.", "notice": "Once you have \\(a(x-h)^2+k\\), the vertex is \\((h,k)\\), and the sign of a tells whether that point is a minimum or maximum."}, "3": {"goal": "Use factored form to find roots, then connect the roots to the symmetry and vertex of a parabola.", "calc": "Factoring exposes the \\(x\\)-intercepts. For a quadratic, the axis of symmetry lies halfway between the roots, giving a direct route from zeros to the vertex.", "notice": "Different algebraic forms emphasize different features of the same parabola: factored form reveals roots; vertex form reveals the turning point."}};
 try{
  const r=await fetch(SOURCE,{cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status);
  const text=await r.text(); const p=new DOMParser(); const doc=p.parseFromString(text,'text/html');
  doc.querySelectorAll('script[src*="mathjax"],#MathJax-script').forEach(s=>s.remove());
  [...doc.querySelectorAll('script')].filter(s=>(s.textContent||'').includes('window.MathJax')).forEach(s=>s.remove());
  const mjCfg=doc.createElement('script'); mjCfg.textContent=`window.MathJax={tex:{inlineMath:[['\\\\(','\\\\)']],displayMath:[['\\\\[','\\\\]']],processEscapes:true},chtml:{scale:1,mtextInheritFont:true},options:{skipHtmlTags:['script','noscript','style','textarea','pre','code']}};window.typesetMath=function(nodes){if(!(window.MathJax&&MathJax.typesetPromise))return Promise.resolve();const els=!nodes?undefined:(Array.isArray(nodes)?nodes:[nodes]).filter(Boolean);return MathJax.typesetPromise(els).catch(()=>{})};`;
  doc.head.appendChild(mjCfg); const mj=doc.createElement('script'); mj.id='MathJax-script'; mj.defer=true; mj.src='https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js'; doc.head.appendChild(mj);
  const style=doc.createElement('style'); style.textContent=`
    :root{
      --ink:#172033;--paper:#f4f6fb;--card:#ffffff;--field:#ffffff;--rule:#d8dfeb;
      --muted:#617086;--blue:#245b96;--blue-bg:#edf4fc;--blue-rule:#c9dbef;
      --green:#21704c;--green-bg:#eef8f2;--green-rule:#bfdfcb;--amber:#946400;
      --amber-bg:#fff8e6;--red:#a53a3a;--red-bg:#fff0f0;--shadow:0 8px 24px rgba(30,50,80,.075);
      --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    }
    body[data-theme="dark"]{
      --ink:#edf2f8;--paper:#0c1220;--card:#151e2f;--field:#0f1728;--rule:#334158;
      --muted:#a9b6c9;--blue:#91bdf0;--blue-bg:#17283e;--blue-rule:#345678;
      --green:#8bd0aa;--green-bg:#173126;--green-rule:#355e49;--amber:#f2c66d;
      --amber-bg:#332a13;--red:#ffaaaa;--red-bg:#3a2023;--shadow:0 8px 24px rgba(0,0,0,.18);
    }
    html{scroll-behavior:smooth} body{background:var(--paper)!important;color:var(--ink)!important;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important;font-size:17px!important;line-height:1.6!important;padding-top:0!important;transition:background .15s,color .15s}
    .wrap{max-width:960px!important;margin:0 auto!important;padding:30px 24px 90px!important}
    header{border:0!important;margin:12px 0 18px!important;padding:26px 28px!important;border-radius:18px!important;background:linear-gradient(135deg,var(--blue-bg),var(--card))!important;box-shadow:var(--shadow)!important;border:1px solid var(--blue-rule)!important}
    header h1{font-family:inherit!important;font-size:clamp(26px,4vw,36px)!important;line-height:1.15!important;color:var(--ink)!important;margin:0 0 6px!important}

    .student-topbar{position:sticky;top:0;z-index:1000;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule);box-shadow:0 3px 12px rgba(0,0,0,.05)}

    .student-topbar .status{margin-left:auto;font:12px var(--mono);color:var(--muted)}
    .student-start{padding:18px 22px;margin:0 0 18px}.student-start h2,.lab-story h2{font-size:18px;margin:0 0 8px;color:var(--blue)!important}.student-start p,.lab-story p{margin:7px 0}
    .student-start label{display:block;font:12px var(--mono);color:var(--muted);margin-top:13px}.student-start input{width:min(360px,100%)}

    .problem{margin:0 0 24px!important;padding:22px 24px!important;scroll-margin-top:76px}.problem>h2{font-family:inherit!important;font-size:22px!important;line-height:1.25!important;margin:0 0 10px!important;border:0!important;padding:0!important;color:var(--ink)!important}

    .problem-guide .guide-goal{padding:11px 14px;border-bottom:1px solid var(--blue-rule)}.problem-guide .guide-goal strong{color:var(--blue)}
    .guide-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:0}.guide-grid>div{padding:12px 14px}.guide-grid>div+div{border-left:1px solid var(--blue-rule)}.guide-label{display:block;font:650 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--blue);margin-bottom:4px}
    .scenario{background:var(--card)!important;border:0!important;border-left:4px solid var(--blue)!important;border-radius:0 8px 8px 0!important;padding:11px 14px!important;margin:12px 0 16px!important;color:var(--ink)!important;box-shadow:inset 0 0 0 1px var(--rule)}
    .part{margin:0!important;padding:16px 0!important;border-top:1px solid var(--rule)}.part:first-of-type{border-top:0}.part-stem{gap:9px!important}.part-label{color:var(--blue)!important}.part-text{color:var(--ink)!important}
    .answer-row,.text-answer,details{margin-left:28px!important}.answer-row label,.text-answer label{color:var(--muted)!important}.answer-row input[type=text],.answer-row input[type=number],.text-answer textarea,.student-start input,select{background:var(--field)!important;color:var(--ink)!important;border:1px solid var(--rule)!important;border-radius:8px!important;padding:8px 10px!important;font-family:var(--mono)!important}.text-answer textarea{font-family:inherit!important;min-height:86px!important}
    .answer-row input.ok{border-color:var(--green)!important;background:var(--green-bg)!important}.answer-row input.no{border-color:var(--red)!important;background:var(--red-bg)!important}
    .check-btn{background:var(--blue)!important;color:#fff!important;border-radius:8px!important;padding:8px 12px!important}.check-btn:hover{filter:brightness(.96)}
    .verdict.ok{color:var(--green)!important}.verdict.no{color:var(--red)!important}summary{color:var(--green)!important;font-family:var(--mono)!important}.solution{background:var(--green-bg)!important;color:var(--ink)!important;border-left-color:var(--green)!important}.solution .ans{color:var(--green)!important}
    .note{color:var(--muted)!important}.demo-link{background:var(--amber-bg)!important;border-color:color-mix(in srgb,var(--amber) 35%,var(--rule))!important;color:var(--ink)!important}.demo-link a{color:var(--amber)!important}.footer{color:var(--muted)!important;border-color:var(--rule)!important}
    mjx-container{color:inherit!important;max-width:100%;overflow-x:auto;overflow-y:hidden}\n    input:focus,textarea:focus,select:focus{outline:3px solid color-mix(in srgb,var(--blue) 22%,transparent)!important;outline-offset:1px;border-color:var(--blue)!important}
    .meaning-checkpoint{margin-top:10px;padding:10px 13px;border-radius:10px;background:var(--green-bg);border:1px solid var(--green-rule);font-size:14px}.meaning-checkpoint strong{color:var(--green)}
    @media(max-width:720px){.wrap{padding:20px 14px 70px!important}.workflow,.guide-grid{grid-template-columns:1fr}.guide-grid>div+div{border-left:0;border-top:1px solid var(--blue-rule)}.problem{padding:18px 16px!important}.answer-row,.text-answer,details{margin-left:0!important}.answer-row input[type=text]{width:96px!important}.student-topbar .status{width:100%;margin-left:0}}
    @media print{body{--ink:#111;--paper:#fff;--card:#fff;--field:#fff;--rule:#bbb;--muted:#444;--blue:#234e7b;--blue-bg:#f4f7fb;--blue-rule:#ccd8e5;--green:#215b3e;--green-bg:#f2f8f4;--green-rule:#c5d8cc;--amber:#7a5600;--amber-bg:#fffaf0;--red:#922;--red-bg:#fff;--shadow:none;background:#fff!important}.student-topbar,.student-start .save-note{display:none!important}.wrap{max-width:none!important;padding:0!important}.problem,.objectives,.student-start,.lab-story,header{box-shadow:none!important;break-inside:avoid}.check-btn{display:none!important}details{display:block!important}details>summary{display:none!important}.solution{display:block!important}.problem{margin-bottom:14px!important}}
  `; doc.head.appendChild(style);
  const body=doc.body; body.setAttribute('data-student-lab','precalc-week-'+WEEK);
  body.dataset.theme=localStorage.getItem('precalc_lab_theme')||'light';
  const oldToolbar=body.querySelector('.toolbar'); if(oldToolbar) oldToolbar.remove();
  const bar=doc.createElement('div'); bar.className='student-topbar'; bar.innerHTML=`<div class="student-topbar-inner"><button class="primary" onclick="saveFilledHTML()">Save filled HTML</button><button onclick="window.print()">Print / Save PDF</button><button onclick="jumpNext()">Next problem</button><button id="themeToggle" onclick="toggleStudentTheme()">Theme</button><button onclick="clearStudentData()">Clear answers</button><span class="status"><span id="studentProgress">0% started</span> · <span id="saveStatus">autosave ready</span></span></div>`; body.insertBefore(bar,body.firstChild);
  const wrap=body.querySelector('.wrap')||body; const header=wrap.querySelector('header');
  const start=doc.createElement('section'); start.className='student-start'; start.innerHTML=`<h2>How to work this lab</h2><p>Work in order, but do not treat the answer boxes as the destination. For each problem, first identify what mathematical feature you are trying to uncover, then do the calculation, then say to yourself what the result tells you about the graph, model, or system.</p><div class="workflow"><div><strong>1 · Predict</strong>What should the answer roughly look like, and why?</div><div><strong>2 · Calculate</strong>Carry out the algebra and use Check for numerical work.</div><div><strong>3 · Interpret</strong>Connect the result back to shape, rate, structure, or context.</div></div><p class="save-note">Your work autosaves in this browser. <strong>Save filled HTML</strong> makes a portable copy with your current answers embedded. <strong>Print / Save PDF</strong> creates a frozen classroom or submission copy.</p><label for="studentName">Student name</label><input id="studentName" data-student-field="name" autocomplete="name" placeholder="Your name"></section>`;
  if(header) header.insertAdjacentElement('afterend',start); else wrap.insertBefore(start,wrap.firstChild);
  const obj=wrap.querySelector('.objectives'); const story=doc.createElement('section'); story.className='lab-story'; story.innerHTML=`<h2>Big idea for Week ${WEEK}</h2><p>${META.big}</p><p class="question-line"><strong>Keep this question in view:</strong> ${META.questions}</p>`; if(obj)obj.insertAdjacentElement('afterend',story); else start.insertAdjacentElement('afterend',story);
  body.querySelectorAll('.problem').forEach((el,i)=>{
    const h=el.querySelector('h2'); if(!h)return; const guide=GUIDES[String(i+1)]; if(!guide)return;
    const g=doc.createElement('div');g.className='problem-guide';g.innerHTML=`<div class="guide-goal"><strong>Goal:</strong> ${guide.goal}</div><div class="guide-grid"><div><span class="guide-label">Calculation → meaning</span>${guide.calc}</div><div><span class="guide-label">What to notice</span>${guide.notice}</div></div>`;h.insertAdjacentElement('afterend',g);
    const checkpoint=doc.createElement('div');checkpoint.className='meaning-checkpoint';checkpoint.innerHTML=`<strong>Before you move on:</strong> be able to explain, without looking at the solution, what the main calculation in this problem tells you—not only what number or formula you obtained.`;el.appendChild(checkpoint);
  });
  const sc=doc.createElement('script'); sc.textContent=`
  (function(){
    const BASE='precalc_student_week_${WEEK}';
    let copyId=document.body.dataset.copyId||'working';
    const key=()=>BASE+'_'+copyId;
    const fields=()=>[...document.querySelectorAll('input,textarea,select')].filter(e=>!e.closest('.solution'));
    const answers=()=>fields().filter(e=>e.id!=='studentName' && (e.matches('textarea')||e.matches('select')||e.matches('input[type=text],input[type=number]')));
    function embeddedHasValue(e){if(e.type==='checkbox'||e.type==='radio')return e.checked;return String(e.value||'').trim()!=='';}
    function updateThemeButton(){const b=document.getElementById('themeToggle');if(b)b.textContent=document.body.dataset.theme==='dark'?'☀ Light':'☾ Dark';}
    window.toggleStudentTheme=function(){const next=document.body.dataset.theme==='dark'?'light':'dark';document.body.dataset.theme=next;try{localStorage.setItem('precalc_lab_theme',next)}catch(e){}updateThemeButton();};
    function load(){try{const data=JSON.parse(localStorage.getItem(key())||'{}');fields().forEach(e=>{if(data[e.id]!==undefined&&!embeddedHasValue(e)){if(e.type==='checkbox'||e.type==='radio')e.checked=!!data[e.id];else e.value=data[e.id];}});}catch(e){}updateThemeButton();update();}
    function persist(){const data={};fields().forEach(e=>{if(!e.id)return;data[e.id]=(e.type==='checkbox'||e.type==='radio')?e.checked:e.value});try{localStorage.setItem(key(),JSON.stringify(data));}catch(e){}const s=document.getElementById('saveStatus');if(s)s.textContent='saved in browser';update();}
    function update(){const a=answers(),done=a.filter(embeddedHasValue).length,pct=a.length?Math.round(100*done/a.length):0;const p=document.getElementById('studentProgress');if(p)p.textContent=pct+'% started';}
    window.clearStudentData=function(){if(!confirm('Clear the answers saved in this copy of the lab?'))return;try{localStorage.removeItem(key())}catch(e){}fields().forEach(e=>{if(e.id==='studentName')e.value='';else if(e.type==='checkbox'||e.type==='radio')e.checked=false;else e.value=''});document.querySelectorAll('.verdict').forEach(v=>v.textContent='');update();};
    window.jumpNext=function(){const probs=[...document.querySelectorAll('.problem')];const y=scrollY+90;let next=probs.find(p=>p.offsetTop>y);(next||probs[0])?.scrollIntoView({behavior:'smooth',block:'start'});};
    window.saveFilledHTML=function(){persist();const clone=document.documentElement.cloneNode(true);const newId=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));clone.querySelector('body').dataset.copyId=newId;const live=fields(),copied=[...clone.querySelectorAll('input,textarea,select')].filter(e=>!e.closest('.solution'));live.forEach((e,i)=>{const c=copied[i];if(!c)return;if(e.type==='checkbox'||e.type==='radio'){if(e.checked)c.setAttribute('checked','');else c.removeAttribute('checked')}else if(e.tagName==='TEXTAREA'){c.textContent=e.value}else if(e.tagName==='SELECT'){[...c.options].forEach((o,j)=>{if(j===e.selectedIndex)o.setAttribute('selected','');else o.removeAttribute('selected')})}else c.setAttribute('value',e.value)});const html='<!DOCTYPE html>\\n'+clone.outerHTML;const blob=new Blob([html],{type:'text/html'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);const nm=(document.getElementById('studentName')?.value||'Student').trim().replace(/[^a-z0-9_-]+/gi,'_');a.download='Precalc_Week_${WEEK}_Lab_'+(nm||'Student')+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);const s=document.getElementById('saveStatus');if(s)s.textContent='filled HTML downloaded';};
    document.addEventListener('input',persist);document.addEventListener('change',persist);window.addEventListener('load',load);if(document.readyState!=='loading')load();
  })();`;
  body.appendChild(sc);
  document.open();document.write('<!DOCTYPE html>'+doc.documentElement.outerHTML);document.close();
 }catch(e){document.getElementById('err').textContent='The lab could not be loaded. Check your internet connection and reopen this file. ('+e.message+')';}
})();
</script></body></html>
