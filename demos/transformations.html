<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transformations of f(x)</title>
<style>
  :root {
    --ink: #1a1d24;
    --paper: #f7f4ec;
    --grid: #cfc8b8;
    --axis: #6b6456;
    --accent: #b5482f;
    --panel: #ffffff;
    --good: #2e7d4f;
    --bad: #b5482f;
    /* quadrant colors */
    --q1: #d8542f; /* top-right  */
    --q2: #e0a92e; /* top-left   */
    --q3: #2f7d8d; /* bottom-left*/
    --q4: #5c4d9e; /* bottom-right*/
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    line-height: 1.5;
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 {
    font-size: clamp(1.6rem, 4vw, 2.3rem);
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .sub { color: var(--axis); margin: 0 0 24px; font-size: 1.05rem; }
  .stage {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .panel-box {
    background: var(--panel);
    border: 1px solid var(--grid);
    border-radius: 10px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .panel-label {
    font-size: .95rem;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--axis);
    margin: 0 0 8px;
  }
  .panel-box.after .panel-label { color: var(--accent); }
  svg { width: 100%; height: auto; display: block; }
  @media (max-width: 520px) {
    .stage { grid-template-columns: 1fr; }
  }
  .prompt {
    margin: 22px 0 12px;
    font-size: 1.15rem;
  }
  .prompt b { color: var(--accent); }
  .choices { display: grid; gap: 10px; }
  button.choice {
    text-align: left;
    font-family: "SFMono-Regular", "Cascadia Code", Menlo, Consolas, monospace;
    font-size: 1.1rem;
    background: var(--panel);
    border: 1.5px solid var(--grid);
    border-radius: 8px;
    padding: 13px 16px;
    cursor: pointer;
    color: var(--ink);
    transition: border-color .12s, background .12s, transform .04s;
  }
  button.choice:hover { border-color: var(--axis); }
  button.choice:active { transform: translateY(1px); }
  button.choice:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button.choice.correct { border-color: var(--good); background: #eaf5ee; }
  button.choice.wrong   { border-color: var(--bad);  background: #fbeae6; }
  button.choice:disabled { cursor: default; opacity: 1; }
  .feedback {
    margin: 16px 0 0;
    min-height: 1.6em;
    font-size: 1.08rem;
  }
  .feedback.good { color: var(--good); }
  .feedback.bad  { color: var(--bad); }
  .bar { margin-top: 22px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .next {
    font-family: inherit;
    font-size: 1.05rem;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 8px;
    padding: 11px 22px;
    cursor: pointer;
  }
  .next:disabled { opacity: .35; cursor: default; }
  .next:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .score { color: var(--axis); font-size: 1rem; }
  .legend { color: var(--axis); font-size: .92rem; margin-top: 10px; }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Reading a transformation</h1>

  <div class="stage">
    <div class="panel-box before">
      <p class="panel-label">Original &nbsp;y = f(x)</p>
      <svg id="boardA" viewBox="-10 -10 20 20" preserveAspectRatio="xMidYMid meet" aria-label="Original square on coordinate plane"></svg>
    </div>
    <div class="panel-box after">
      <p class="panel-label">Transformed &nbsp;y = g(x)</p>
      <svg id="boardB" viewBox="-10 -10 20 20" preserveAspectRatio="xMidYMid meet" aria-label="Transformed square on coordinate plane"></svg>
    </div>
  </div>

  <p class="prompt">Which formula transforms the square from left to right??</p>
  <div class="choices" id="choices"></div>

  <p class="feedback" id="feedback" aria-live="polite"></p>

  <div class="bar">
    <button class="next" id="next" disabled>Next &rarr;</button>
    <span class="score" id="score">Score: 0 / 0</span>
  </div>
</div>

<script>
const BOARD_A = document.getElementById('boardA');
const BOARD_B = document.getElementById('boardB');
const NS = 'http://www.w3.org/2000/svg';

// Base square: side 6, centered at origin, one colored cell per quadrant.
// Cells defined as [x, y, w, h, cssColorVar]
const CELLS = [
  [0, 0, 3, 3, '--q1'],   // quadrant I  (top-right)
  [-3, 0, 3, 3, '--q2'],  // quadrant II (top-left)
  [-3, -3, 3, 3, '--q3'], // quadrant III(bottom-left)
  [0, -3, 3, 3, '--q4'],  // quadrant IV (bottom-right)
];

// Transformations: label is the function-notation form; fn maps a point (x,y)->(x',y').
// We transform the GRAPH, so a point (x, f(x)) goes to its image under the named operation.
// Standard graph-transformation conventions:
//   f(x) + k       : shift up k            (x, y) -> (x, y+k)
//   f(x) - k       : shift down k          (x, y) -> (x, y-k)
//   f(x + h)       : shift left h          (x, y) -> (x-h, y)
//   f(x - h)       : shift right h         (x, y) -> (x+h, y)
//   -f(x)          : reflect over x-axis   (x, y) -> (x, -y)
//   f(-x)          : reflect over y-axis   (x, y) -> (-x, y)
//   a*f(x), a>1    : vertical stretch      (x, y) -> (x, a*y)
//   a*f(x), 0<a<1  : vertical compress     (x, y) -> (x, a*y)
//   f(b*x), b>1    : horizontal compress   (x, y) -> (x/b, y)
//   f(x/b)         : horizontal stretch    (x, y) -> (b*x, y)  [written f((1/b)x)]
const TRANSFORMS = [
  { label: 'f(x) + 4',      fn: (p)=>[p[0], p[1]+4],     desc: 'Adding 4 outside f shifts the graph up 4.' },
  { label: 'f(x) \u2212 4',  fn: (p)=>[p[0], p[1]-4],     desc: 'Subtracting 4 outside f shifts the graph down 4.' },
  { label: 'f(x \u2212 4)',  fn: (p)=>[p[0]+4, p[1]],     desc: 'x \u2212 4 inside f shifts the graph right 4 (inside moves opposite to the sign).' },
  { label: 'f(x + 4)',      fn: (p)=>[p[0]-4, p[1]],     desc: 'x + 4 inside f shifts the graph left 4 (inside moves opposite to the sign).' },
  { label: '\u2212f(x)',     fn: (p)=>[p[0], -p[1]],      desc: 'The negative outside f reflects the graph over the x-axis.' },
  { label: 'f(\u2212x)',     fn: (p)=>[-p[0], p[1]],      desc: 'The negative inside f reflects the graph over the y-axis.' },
  { label: '2f(x)',         fn: (p)=>[p[0], 2*p[1]],     desc: 'Multiplying by 2 outside f stretches the graph vertically by a factor of 2.' },
  { label: '\u00BDf(x)',     fn: (p)=>[p[0], 0.5*p[1]],   desc: 'Multiplying by \u00BD outside f compresses the graph vertically toward the x-axis.' },
  { label: 'f(2x)',         fn: (p)=>[p[0]/2, p[1]],     desc: 'The 2 inside f compresses the graph horizontally toward the y-axis.' },
  { label: 'f(\u00BDx)',     fn: (p)=>[2*p[0], p[1]],     desc: 'The \u00BD inside f stretches the graph horizontally away from the y-axis.' },
];

let current = null;     // the correct transform object
let answered = false;
let right = 0, total = 0;

function colorOf(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

function drawGrid(svg){
  svg.innerHTML = '';
  // grid lines
  for(let i=-10;i<=10;i++){
    const vx = el('line',{x1:i,y1:-10,x2:i,y2:10,stroke:'var(--grid)','stroke-width':0.05});
    const hz = el('line',{x1:-10,y1:i,x2:10,y2:i,stroke:'var(--grid)','stroke-width':0.05});
    svg.appendChild(vx); svg.appendChild(hz);
  }
  // axes
  svg.appendChild(el('line',{x1:-10,y1:0,x2:10,y2:0,stroke:'var(--axis)','stroke-width':0.09}));
  svg.appendChild(el('line',{x1:0,y1:-10,x2:0,y2:10,stroke:'var(--axis)','stroke-width':0.09}));
  // tick labels at units of 5
  [-5,5].forEach(n=>{
    svg.appendChild(text(n, 0.25, -0.4, n));
    svg.appendChild(text(0.3, n, -0.4, n));
  });
}

function el(tag, attrs){
  const e = document.createElementNS(NS, tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
// SVG y is flipped (down is positive), so we negate y when drawing.
function text(x,y,dy,str){
  const t = el('text',{x:x, y:-y, 'font-size':0.7, fill:'var(--axis)', 'font-family':'monospace'});
  t.textContent = str;
  return t;
}

function drawSquare(svg, transform, solid){
  CELLS.forEach(([cx,cy,w,h,cvar])=>{
    // four corners of the cell, mapped
    const pts = [[cx,cy],[cx+w,cy],[cx+w,cy+h],[cx,cy+h]].map(transform);
    const d = pts.map((p,i)=>(i?'L':'M')+p[0]+' '+(-p[1])).join(' ')+' Z';
    const poly = el('path',{
      d:d, fill:colorOf(cvar),
      'fill-opacity': solid?0.85:0.16,
      stroke:'#1a1d24', 'stroke-width':0.06,
      'stroke-opacity': solid?0.9:0.3,
    });
    if(!solid) poly.setAttribute('stroke-dasharray','0.35 0.3');
    svg.appendChild(poly);
  });
}

function newQuestion(){
  answered = false;
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('next').disabled = true;

  current = TRANSFORMS[Math.floor(Math.random()*TRANSFORMS.length)];

  drawGrid(BOARD_A);
  drawSquare(BOARD_A, p=>p, true);          // original, solid, left panel

  drawGrid(BOARD_B);
  drawSquare(BOARD_B, current.fn, true);    // solid transformed, right panel

  // build choices: correct + 3 distractors
  const pool = TRANSFORMS.filter(t=>t!==current);
  shuffle(pool);
  const opts = shuffle([current, pool[0], pool[1], pool[2]]);

  const box = document.getElementById('choices');
  box.innerHTML = '';
  opts.forEach(opt=>{
    const b = document.createElement('button');
    b.className = 'choice';
    b.textContent = 'g(x) = ' + opt.label;
    b.onclick = ()=>choose(b, opt);
    box.appendChild(b);
  });
}

function choose(btn, opt){
  if(answered) return;
  answered = true;
  total++;
  const fb = document.getElementById('feedback');
  const buttons = document.querySelectorAll('.choice');
  buttons.forEach(b=>b.disabled = true);

  if(opt === current){
    right++;
    btn.classList.add('correct');
    fb.textContent = 'Correct. ' + current.desc;
    fb.className = 'feedback good';
  } else {
    btn.classList.add('wrong');
    buttons.forEach(b=>{
      if(b.textContent === 'g(x) = ' + current.label) b.classList.add('correct');
    });
    fb.textContent = 'Not quite. ' + current.desc;
    fb.className = 'feedback bad';
  }
  document.getElementById('score').textContent = `Score: ${right} / ${total}`;
  document.getElementById('next').disabled = false;
}

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

document.getElementById('next').onclick = newQuestion;
newQuestion();
</script>
</body>
</html>
