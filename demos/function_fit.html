<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Precalculus Function Fit Lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  :root {
    --bg: #f7f7fb;
    --card: #ffffff;
    --ink: #1f2937;
    --ink-strong: #111827;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-soft: #eef2ff;
    --accent-ink: #1d4ed8;
    --curve: #2563eb;
    --target: #10b981;
    --bad: #ef4444;
    --warn: #f59e0b;
    --good: #10b981;
    --grid: #e5e7eb;
    --line: #e5e7eb;
    --panel-bg: #f9fafb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }

  header {
    padding: 18px 22px 8px;
    max-width: 1220px;
    margin: 0 auto;
  }
  h1 {
    margin: 0 0 6px;
    font-size: clamp(1.4rem, 3vw, 2.1rem);
    color: var(--ink-strong);
    letter-spacing: -0.01em;
  }
  .subtitle {
    margin: 0;
    color: var(--muted);
    line-height: 1.4;
    max-width: 72ch;
  }

  main {
    max-width: 1220px;
    margin: 0 auto;
    padding: 12px 22px 28px;
    display: grid;
    grid-template-columns: minmax(340px, 1fr) 380px;
    gap: 18px;
    align-items: start;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(15,23,42,.05);
  }

  .plot-card { padding: 14px; }
  canvas {
    width: 100%;
    height: min(72vh, 720px);
    min-height: 460px;
    border-radius: 12px;
    background: white;
    display: block;
    border: 1px solid #eef2f7;
  }

  .formula-card {
    margin-top: 12px;
    padding: 12px 14px;
    border-radius: 12px;
    background: #f8fafc;
    border: 1px solid var(--line);
  }
  .formula-label {
    color: var(--muted);
    font-size: .82rem;
    margin-bottom: 6px;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .formula-wrap {
    text-align: center;
    overflow-x: auto;
    overflow-y: visible;
    padding: 4px 0 6px;
  }
  #currentFormula {
    display: inline-block;
    min-height: 2.6rem;
    white-space: nowrap;
  }

  .panel {
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    position: sticky;
    top: 14px;
  }

  label {
    font-size: .9rem;
    color: #374151;
    font-weight: 600;
  }
  select, input[type="number"] {
    width: 100%;
    padding: 9px 10px;
    border-radius: 10px;
    border: 1px solid #d1d5db;
    background: white;
    font: inherit;
  }
  select:focus, input:focus {
    outline: 2px solid var(--accent-soft);
    outline-offset: -1px;
    border-color: var(--accent);
  }

  .field { display: flex; flex-direction: column; gap: 5px; }

  .slider-group {
    display: grid;
    gap: 5px;
    padding: 9px 11px;
    border-radius: 11px;
    background: var(--panel-bg);
    border: 1px solid #eef2f7;
  }
  .slider-head {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    align-items: baseline;
  }
  .slider-head code {
    font-size: .88rem;
    background: var(--accent-soft);
    padding: 2px 8px;
    border-radius: 7px;
    color: var(--accent-ink);
    font-family: ui-monospace, "DM Mono", SFMono-Regular, Menlo, Consolas, monospace;
    min-width: 3.4em;
    text-align: center;
  }
  input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
  }

  .metric {
    border-radius: 12px;
    padding: 11px 12px;
    background: #f8fafc;
    border: 1px solid var(--line);
  }
  .metric-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: .9rem;
    color: #374151;
    font-weight: 600;
  }
  .metric-head strong {
    font-size: 1.15rem;
    color: var(--ink-strong);
    font-family: ui-monospace, "DM Mono", monospace;
  }
  .meter {
    height: 10px;
    border-radius: 999px;
    background: #e5e7eb;
    overflow: hidden;
    margin-top: 8px;
  }
  .fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--bad), var(--warn), var(--good));
    transition: width .18s ease;
  }

  .status {
    padding: 10px 12px;
    border-radius: 11px;
    font-weight: 700;
    text-align: center;
    font-size: .95rem;
    background: #fee2e2;
    color: #991b1b;
  }
  .status.close { background: #fef3c7; color: #92400e; }
  .status.win   { background: #d1fae5; color: #065f46; }

  .buttons {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }
  button {
    border: 1px solid #d1d5db;
    border-radius: 10px;
    padding: 10px 8px;
    cursor: pointer;
    background: white;
    color: var(--ink-strong);
    font: inherit;
    font-weight: 600;
    transition: background 140ms ease, border-color 140ms ease;
  }
  button:hover { background: #f5f5f7; border-color: var(--accent); }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  button.primary:hover { background: #1e4fd1; border-color: #1e4fd1; }

  .toggles {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    font-size: .88rem;
    color: var(--muted);
  }
  .toggles label { display: flex; align-items: center; gap: 6px; font-weight: 500; }

  .no-trig {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: .88rem;
    color: var(--muted);
    font-weight: 500;
  }

  .hidden-answer {
    display: none;
    background: #f1f5f9;
    border: 1px dashed #94a3b8;
    padding: 12px;
    border-radius: 12px;
    font-size: .92rem;
    line-height: 1.55;
  }
  .hidden-answer .row-line { margin-bottom: 4px; }
  .hidden-answer .row-line:last-child { margin-bottom: 0; }
  .hidden-answer .k {
    color: var(--muted);
    font-size: .78rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-weight: 700;
    margin-right: 4px;
  }
  .hidden-answer .mono {
    font-family: ui-monospace, "DM Mono", SFMono-Regular, Menlo, Consolas, monospace;
    font-size: .88rem;
    color: #334155;
  }

  /* ------- pure HTML math rendering ------- */
  .math-inline, .math-display {
    font-family: "STIX Two Math", "Cambria Math", "Latin Modern Math", "Times New Roman", serif;
    color: var(--ink-strong);
  }
  .math-inline { font-size: 1.02em; }
  .math-inline i, .math-display i { font-style: italic; }

  .math-display {
    font-size: clamp(1.15rem, 2vw, 1.5rem);
    line-height: 2.4;
    font-weight: 500;
  }

  .frac {
    display: inline-block;
    vertical-align: -0.55em;
    text-align: center;
    font-size: 0.88em;
    margin: 0 0.15em;
  }
  .frac > .n, .frac > .d {
    display: block;
    padding: 0 0.4em;
    line-height: 1.15;
  }
  .frac > .n { padding-bottom: 2px; }
  .frac > .d {
    padding-top: 2px;
    border-top: 1.3px solid currentColor;
  }

  .sqrt {
    display: inline-flex;
    align-items: baseline;
    margin: 0 0.1em;
  }
  .sqrt > .r {
    font-size: 1.15em;
    line-height: 1;
    padding-right: 1px;
  }
  .sqrt > .i {
    border-top: 1.3px solid currentColor;
    padding: 1px 0.25em 0;
    margin-left: -0.15em;
  }

  .abs {
    display: inline-block;
    padding: 0 0.35em;
    border-left: 1.4px solid currentColor;
    border-right: 1.4px solid currentColor;
  }

  sup.exp {
    font-size: 0.68em;
    vertical-align: super;
    line-height: 0;
  }

  @media (max-width: 940px) {
    main { grid-template-columns: 1fr; }
    canvas { height: 58vh; min-height: 360px; }
    .panel { position: static; }
  }
</style>
</head>
<body>
<header>
  <h1>Precalculus Function Fit Lab</h1>
  <p class="subtitle">
    A hidden transformed parent function generated the point cloud. Pick a family and tune
    <span class="math-inline"><i>y</i> = <i>A</i>·<i>f</i>(<i>b</i>(<i>x</i>&nbsp;−&nbsp;<i>h</i>)) + <i>k</i></span>
    until your curve fits.
  </p>
</header>

<main>
  <section class="card plot-card">
    <canvas id="plot"></canvas>
    <div class="formula-card">
      <div class="formula-label">Current model</div>
      <div class="formula-wrap">
        <div class="math-display" id="currentFormula"><i>y</i> = <i>x</i></div>
      </div>
    </div>
  </section>

  <aside class="card panel">
    <div class="field">
      <label for="family">Parent function <span class="math-inline"><i>f</i>(<i>x</i>)</span></label>
      <select id="family"></select>
    </div>

    <label class="no-trig">
      <input type="checkbox" id="noTrigMode">
      No trigonometry mode
    </label>

    <div class="slider-group">
      <div class="slider-head">
        <label for="A">Vertical scale <span class="math-inline"><i>A</i></span></label>
        <code id="Aval">1.00</code>
      </div>
      <input id="A" type="range" min="-5" max="5" step="0.05" value="1">
    </div>
    <div class="slider-group">
      <div class="slider-head">
        <label for="b">Horizontal scale <span class="math-inline"><i>b</i></span></label>
        <code id="bval">1.00</code>
      </div>
      <input id="b" type="range" min="-5" max="5" step="0.05" value="1">
    </div>
    <div class="slider-group">
      <div class="slider-head">
        <label for="h">Horizontal shift <span class="math-inline"><i>h</i></span></label>
        <code id="hval">0.00</code>
      </div>
      <input id="h" type="range" min="-8" max="8" step="0.05" value="0">
    </div>
    <div class="slider-group">
      <div class="slider-head">
        <label for="k">Vertical shift <span class="math-inline"><i>k</i></span></label>
        <code id="kval">0.00</code>
      </div>
      <input id="k" type="range" min="-8" max="8" step="0.05" value="0">
    </div>

    <div class="metric">
      <div class="metric-head">
        <span>Fit score</span>
        <strong id="score">0%</strong>
      </div>
      <div class="meter"><div class="fill" id="fill"></div></div>
    </div>

    <div id="status" class="status">Start fitting.</div>

    <div class="buttons">
      <button class="primary" id="newData">New cloud</button>
      <button id="resetGuess">Reset</button>
      <button id="toggleAnswer">Teacher key</button>
    </div>

    <div class="toggles">
      <label><input type="checkbox" id="showResiduals"> residuals</label>
      <label><input type="checkbox" id="showTarget"> target curve</label>
    </div>

    <div id="answer" class="hidden-answer"></div>
  </aside>
</main>

<script>
// ============ families ============
const families = [
  { id:"linear",      name:"Linear:  f(x) = x",          f:t=>t,                             domain:t=>true, xmin:-8, xmax:8 },
  { id:"quadratic",   name:"Quadratic:  f(x) = x²",      f:t=>t*t,                           domain:t=>true, xmin:-6, xmax:6 },
  { id:"cubic",       name:"Cubic:  f(x) = x³",          f:t=>t*t*t,                         domain:t=>true, xmin:-4, xmax:4 },
  { id:"absolute",    name:"Absolute value:  f(x) = |x|", f:t=>Math.abs(t),                  domain:t=>true, xmin:-7, xmax:7 },
  { id:"sqrt",        name:"Square root:  f(x) = √x",    f:t=>Math.sqrt(t),                  domain:t=>t>=0, xmin:-2, xmax:10 },
  { id:"cuberoot",    name:"Cube root:  f(x) = ∛x",      f:t=>Math.sign(t)*Math.pow(Math.abs(t),1/3), domain:t=>true, xmin:-8, xmax:8 },
  { id:"reciprocal",  name:"Reciprocal:  f(x) = 1/x",    f:t=>1/t,                           domain:t=>Math.abs(t)>0.08, xmin:-8, xmax:8 },
  { id:"reciprocal2", name:"Squared reciprocal:  f(x) = 1/x²", f:t=>1/(t*t),                 domain:t=>Math.abs(t)>0.12, xmin:-8, xmax:8 },
  { id:"exponential", name:"Exponential:  f(x) = eˣ",    f:t=>Math.exp(t),                   domain:t=>t<4.2, xmin:-5, xmax:5 },
  { id:"log",         name:"Logarithmic:  f(x) = ln(x)", f:t=>Math.log(t),                   domain:t=>t>0.08, xmin:-1, xmax:10 },
  { id:"sine",        name:"Sine:  f(x) = sin(x)",       trig:true, f:t=>Math.sin(t),        domain:t=>true, xmin:-8, xmax:8 },
  { id:"cosine",      name:"Cosine:  f(x) = cos(x)",     trig:true, f:t=>Math.cos(t),        domain:t=>true, xmin:-8, xmax:8 },
  { id:"tangent",     name:"Tangent:  f(x) = tan(x)",    trig:true, f:t=>Math.tan(t),        domain:t=>Math.abs(Math.cos(t))>0.18 && Math.abs(Math.tan(t))<8, xmin:-5, xmax:5 },
  { id:"arctan",      name:"Arctangent:  f(x) = arctan(x)", trig:true, f:t=>Math.atan(t),    domain:t=>true, xmin:-8, xmax:8 }
];

const familySelect = document.getElementById("family");

function activeFamilies() {
  const noTrig = document.getElementById("noTrigMode")?.checked;
  return noTrig ? families.filter(f => !f.trig) : families;
}
function populateFamilySelect() {
  const current = familySelect.value;
  familySelect.innerHTML = "";
  for (const fam of activeFamilies()) {
    const opt = document.createElement("option");
    opt.value = fam.id;
    opt.textContent = fam.name;
    familySelect.appendChild(opt);
  }
  if (activeFamilies().some(f => f.id === current)) familySelect.value = current;
  else familySelect.value = activeFamilies()[0].id;
}
populateFamilySelect();

const sliders = ["A","b","h","k"].map(id => document.getElementById(id));
const canvas = document.getElementById("plot");
const ctx = canvas.getContext("2d");

let target = null;
let data = [];
let view = { xmin:-10, xmax:10, ymin:-10, ymax:10 };

function rand(a,b){ return a + Math.random()*(b-a); }
function choice(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function normalish(scale=1){
  return scale*(Math.random()+Math.random()+Math.random()+Math.random()+Math.random()+Math.random()-3)/3;
}
function getFamily(id){ return families.find(f=>f.id===id); }

function transformY(fam, x, p) {
  const t = p.b * (x - p.h);
  if (!fam.domain(t)) return NaN;
  const y = p.A * fam.f(t) + p.k;
  if (!Number.isFinite(y) || Math.abs(y)>1e4) return NaN;
  return y;
}

// ============ target + data ============
function makeTarget() {
  const fam = choice(activeFamilies());
  let p = {};
  if (["sine","cosine"].includes(fam.id)) {
    p.A = choice([-1,1]) * rand(1.1, 3.2);
    p.b = choice([-1,1]) * rand(0.45, 1.6);
    p.h = rand(-3, 3);
    p.k = rand(-2.5, 2.5);
  } else if (fam.id === "tangent") {
    p.A = choice([-1,1]) * rand(0.35, 1.1);
    p.b = choice([-1,1]) * rand(0.45, 1.05);
    p.h = rand(-2, 2);
    p.k = rand(-1.5, 1.5);
  } else if (["exponential","reciprocal","reciprocal2"].includes(fam.id)) {
    p.A = choice([-1,1]) * rand(0.6, 2.2);
    p.b = choice([-1,1]) * rand(0.45, 1.35);
    p.h = rand(-2, 2);
    p.k = rand(-3, 3);
  } else if (["sqrt","log"].includes(fam.id)) {
    p.A = choice([-1,1]) * rand(0.9, 2.7);
    p.b = choice([-1,1]) * rand(0.5, 1.4);
    p.h = rand(-3, 3);
    p.k = rand(-3, 3);
  } else if (fam.id === "cubic") {
    p.A = choice([-1,1]) * rand(0.08, 0.35);
    p.b = choice([-1,1]) * rand(0.55, 1.35);
    p.h = rand(-2.5, 2.5);
    p.k = rand(-3, 3);
  } else if (fam.id === "quadratic") {
    p.A = choice([-1,1]) * rand(0.18, 0.8);
    p.b = choice([-1,1]) * rand(0.65, 1.4);
    p.h = rand(-3, 3);
    p.k = rand(-4, 4);
  } else {
    p.A = choice([-1,1]) * rand(0.7, 3.2);
    p.b = choice([-1,1]) * rand(0.6, 1.6);
    p.h = rand(-3, 3);
    p.k = rand(-3.5, 3.5);
  }
  if (Math.abs(p.b) < 0.2) p.b = 1;
  return { fam, p };
}

function generateData() {
  target = makeTarget();
  data = [];
  const N = 54;
  let attempts = 0;
  const xlo = -8.5, xhi = 8.5;
  while (data.length < N && attempts < 4000) {
    attempts++;
    const x = rand(xlo, xhi);
    const y0 = transformY(target.fam, x, target.p);
    if (!Number.isFinite(y0) || Math.abs(y0)>9.5) continue;
    const noise = normalish(0.32 + 0.035*Math.abs(y0));
    const y = y0 + noise;
    if (Number.isFinite(y) && Math.abs(y)<10) data.push({x,y,y0});
  }
  if (data.length < 25) { generateData(); return; }
  setView();
  resetGuess();
  document.getElementById("answer").style.display = "none";
  update();
}

function setView() {
  const xs = data.map(d=>d.x), ys=data.map(d=>d.y);
  let xmin=Math.min(...xs), xmax=Math.max(...xs), ymin=Math.min(...ys), ymax=Math.max(...ys);
  const xpad = Math.max(1.5, (xmax-xmin)*0.12);
  const ypad = Math.max(1.5, (ymax-ymin)*0.18);
  view = { xmin:xmin-xpad, xmax:xmax+xpad, ymin:ymin-ypad, ymax:ymax+ypad };
}

function currentParams() {
  return {
    A: parseFloat(document.getElementById("A").value),
    b: parseFloat(document.getElementById("b").value),
    h: parseFloat(document.getElementById("h").value),
    k: parseFloat(document.getElementById("k").value)
  };
}
function resetGuess() {
  document.getElementById("A").value = "1";
  document.getElementById("b").value = "1";
  document.getElementById("h").value = "0";
  document.getElementById("k").value = "0";
  familySelect.value = "linear";
  update();
}

// ============ fit metric ============
function rmseFor(fam, p) {
  let s = 0, n = 0, invalid = 0;
  for (const d of data) {
    const yhat = transformY(fam, d.x, p);
    if (!Number.isFinite(yhat)) { invalid++; continue; }
    s += (yhat-d.y)*(yhat-d.y);
    n++;
  }
  if (n < Math.max(8, data.length*0.65)) return Infinity;
  return Math.sqrt(s/n) + invalid*0.15;
}
function targetNoiseFloor() {
  let s=0;
  for (const d of data) s += (d.y-d.y0)*(d.y-d.y0);
  return Math.sqrt(s/data.length);
}
function scoreFromRmse(rmse) {
  if (!Number.isFinite(rmse)) return 0;
  const floor = targetNoiseFloor();
  const scale = Math.max(1.2, floor*5.2);
  return Math.max(0, Math.min(100, 100 * Math.exp(-Math.max(0, rmse-floor)/scale)));
}

// ============ number formatting ============
function nice(x) {
  const ax = Math.abs(x);
  if (ax >= 10) return x.toFixed(1);
  if (ax >= 1) return x.toFixed(2);
  return x.toFixed(3);
}
function niceNum(v) {
  if (Math.abs(v) < 1e-9) return "0";
  return String(Number(nice(v)));
}
function niceAbs(v) {
  return niceNum(Math.abs(v));
}

// ============ pure HTML math renderer ============
function fmtInner(b, h) {
  const b1  = Math.abs(b - 1) < 1e-9;
  const bn1 = Math.abs(b + 1) < 1e-9;
  const h0  = Math.abs(h) < 1e-9;
  const xh = h0
    ? "<i>x</i>"
    : (h > 0 ? `<i>x</i> − ${niceAbs(h)}` : `<i>x</i> + ${niceAbs(h)}`);
  if (b1)  return xh;
  if (bn1) return h0 ? "−<i>x</i>" : `−(${xh})`;
  const bstr = b < 0 ? `−${niceAbs(b)}` : niceNum(b);
  return h0 ? `${bstr}<i>x</i>` : `${bstr}(${xh})`;
}

function fmtCoeff(A) {
  if (Math.abs(A - 1) < 1e-9) return "";
  if (Math.abs(A + 1) < 1e-9) return "−";
  const s = niceAbs(A);
  return (A < 0) ? `−${s}·` : `${s}·`;
}

function needsLinearWrap(A, b, h) {
  if (Math.abs(A - 1) < 1e-9) return false;
  const absBOne = Math.abs(Math.abs(b) - 1) < 1e-9;
  if (!absBOne) return false;
  return Math.abs(h) > 1e-9 || Math.abs(b + 1) < 1e-9;
}

function fmtBody(famId, inner, A, b, h) {
  switch (famId) {
    case "linear":
      return needsLinearWrap(A, b, h) ? `(${inner})` : inner;
    case "quadratic":
      return `(${inner})<sup class="exp">2</sup>`;
    case "cubic":
      return `(${inner})<sup class="exp">3</sup>`;
    case "absolute":
      return `<span class="abs">${inner}</span>`;
    case "sqrt":
      return `<span class="sqrt"><span class="r">√</span><span class="i">${inner}</span></span>`;
    case "cuberoot":
      return `<span class="sqrt"><span class="r">∛</span><span class="i">${inner}</span></span>`;
    case "reciprocal":
      return `<span class="frac"><span class="n">1</span><span class="d">${inner}</span></span>`;
    case "reciprocal2":
      return `<span class="frac"><span class="n">1</span><span class="d">(${inner})<sup class="exp">2</sup></span></span>`;
    case "exponential":
      return `<i>e</i><sup class="exp">${inner}</sup>`;
    case "log":     return `ln(${inner})`;
    case "sine":    return `sin(${inner})`;
    case "cosine":  return `cos(${inner})`;
    case "tangent": return `tan(${inner})`;
    case "arctan":  return `arctan(${inner})`;
  }
  return inner;
}

function fmtTail(k) {
  if (Math.abs(k) < 1e-9) return "";
  return k > 0 ? ` + ${niceAbs(k)}` : ` − ${niceAbs(k)}`;
}

function renderModel(fam, p) {
  const coef = fmtCoeff(p.A);
  const inner = fmtInner(p.b, p.h);
  const body = fmtBody(fam.id, inner, p.A, p.b, p.h);
  const tail = fmtTail(p.k);
  return `<i>y</i> = ${coef}${body}${tail}`;
}

// ============ update loop ============
function updateLabels() {
  const p = currentParams();
  document.getElementById("Aval").textContent = nice(p.A);
  document.getElementById("bval").textContent = nice(p.b);
  document.getElementById("hval").textContent = nice(p.h);
  document.getElementById("kval").textContent = nice(p.k);
}

function updateFormula() {
  const fam = getFamily(familySelect.value);
  const p = currentParams();
  document.getElementById("currentFormula").innerHTML = renderModel(fam, p);
}

function updateMetric() {
  const fam = getFamily(familySelect.value);
  const p = currentParams();
  const r = rmseFor(fam, p);
  const score = scoreFromRmse(r);
  document.getElementById("score").textContent = Math.round(score) + "%";
  document.getElementById("fill").style.width = score + "%";

  const status = document.getElementById("status");
  const sameFamily = fam.id === target.fam.id;
  const achieved = score >= 92 && sameFamily;
  const close = score >= 78;

  status.className = "status" + (achieved ? " win" : close ? " close" : "");
  if (achieved) status.textContent = "Fit achieved.";
  else if (close && sameFamily) status.textContent = "Close; keep tuning.";
  else if (close && !sameFamily) status.textContent = "Close, but wrong parent family.";
  else status.textContent = "Keep tuning.";

  const ans = document.getElementById("answer");
  const targetModel = renderModel(target.fam, target.p);
  const yourRmse = Number.isFinite(r) ? nice(r) : "invalid domain";
  ans.innerHTML =
    `<div class="row-line"><span class="k">Family</span>${target.fam.name}</div>` +
    `<div class="row-line math-inline"><span class="k">Target</span>${targetModel}</div>` +
    `<div class="row-line mono"><span class="k">Params</span>A = ${nice(target.p.A)}, b = ${nice(target.p.b)}, h = ${nice(target.p.h)}, k = ${nice(target.p.k)}</div>` +
    `<div class="row-line mono"><span class="k">RMSE</span>noise floor ≈ ${nice(targetNoiseFloor())}  ·  your fit ≈ ${yourRmse}</div>`;
}

// ============ canvas drawing ============
function resizeCanvas() {
  const ratio = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.round(rect.width * ratio);
  canvas.height = Math.round(rect.height * ratio);
  ctx.setTransform(ratio,0,0,ratio,0,0);
}
function X(x) {
  const rect = canvas.getBoundingClientRect();
  return (x-view.xmin)/(view.xmax-view.xmin)*rect.width;
}
function Y(y) {
  const rect = canvas.getBoundingClientRect();
  return rect.height - (y-view.ymin)/(view.ymax-view.ymin)*rect.height;
}

function chooseStep(span) {
  const raw = span / 8;
  const pow = Math.pow(10, Math.floor(Math.log10(raw)));
  const m = raw / pow;
  if (m < 1.5) return pow;
  if (m < 3.5) return 2*pow;
  if (m < 7.5) return 5*pow;
  return 10*pow;
}
function formatTick(v) {
  if (Math.abs(v) < 1e-9) return "0";
  if (Math.abs(v) >= 10) return v.toFixed(0);
  return Number(v.toFixed(1)).toString();
}

function drawGrid() {
  const rect = canvas.getBoundingClientRect();
  ctx.clearRect(0,0,rect.width,rect.height);
  ctx.fillStyle = "white";
  ctx.fillRect(0,0,rect.width,rect.height);

  ctx.lineWidth = 1;
  ctx.strokeStyle = "#e5e7eb";
  ctx.fillStyle = "#6b7280";
  ctx.font = "12px system-ui";

  const xStep = chooseStep(view.xmax-view.xmin);
  const yStep = chooseStep(view.ymax-view.ymin);
  for (let x = Math.ceil(view.xmin/xStep)*xStep; x <= view.xmax; x += xStep) {
    ctx.beginPath(); ctx.moveTo(X(x),0); ctx.lineTo(X(x),rect.height); ctx.stroke();
    if (Math.abs(x)>1e-9) ctx.fillText(formatTick(x), X(x)+3, Y(0)-4);
  }
  for (let y = Math.ceil(view.ymin/yStep)*yStep; y <= view.ymax; y += yStep) {
    ctx.beginPath(); ctx.moveTo(0,Y(y)); ctx.lineTo(rect.width,Y(y)); ctx.stroke();
    if (Math.abs(y)>1e-9) ctx.fillText(formatTick(y), X(0)+4, Y(y)-3);
  }

  ctx.strokeStyle = "#111827";
  ctx.lineWidth = 1.5;
  if (view.ymin < 0 && view.ymax > 0) {
    ctx.beginPath(); ctx.moveTo(0,Y(0)); ctx.lineTo(rect.width,Y(0)); ctx.stroke();
  }
  if (view.xmin < 0 && view.xmax > 0) {
    ctx.beginPath(); ctx.moveTo(X(0),0); ctx.lineTo(X(0),rect.height); ctx.stroke();
  }
}

function drawCurve(fam, p, style) {
  const rect = canvas.getBoundingClientRect();
  ctx.strokeStyle = style.stroke;
  ctx.lineWidth = style.width;
  ctx.setLineDash(style.dash || []);
  let drawing = false;
  ctx.beginPath();
  const steps = 900;
  for (let i=0; i<=steps; i++) {
    const x = view.xmin + (view.xmax-view.xmin)*i/steps;
    const y = transformY(fam,x,p);
    const px = X(x), py = Y(y);
    const ok = Number.isFinite(y) && py > -200 && py < rect.height+200;
    if (ok) {
      if (!drawing) { ctx.moveTo(px,py); drawing = true; }
      else ctx.lineTo(px,py);
    } else {
      if (drawing) { ctx.stroke(); ctx.beginPath(); drawing = false; }
    }
  }
  if (drawing) ctx.stroke();
  ctx.setLineDash([]);
}

function drawPoints() {
  ctx.fillStyle = "#111827";
  ctx.strokeStyle = "white";
  ctx.lineWidth = 1.5;
  for (const d of data) {
    ctx.beginPath();
    ctx.arc(X(d.x), Y(d.y), 4.2, 0, Math.PI*2);
    ctx.fill();
    ctx.stroke();
  }
}

function drawResiduals(fam,p) {
  if (!document.getElementById("showResiduals").checked) return;
  ctx.strokeStyle = "rgba(239,68,68,.55)";
  ctx.lineWidth = 1.2;
  for (const d of data) {
    const yhat = transformY(fam,d.x,p);
    if (!Number.isFinite(yhat)) continue;
    ctx.beginPath();
    ctx.moveTo(X(d.x),Y(d.y));
    ctx.lineTo(X(d.x),Y(yhat));
    ctx.stroke();
  }
}

function update() {
  if (!target) return;
  resizeCanvas();
  updateLabels();
  const fam = getFamily(familySelect.value);
  const p = currentParams();
  drawGrid();
  if (document.getElementById("showTarget").checked) {
    drawCurve(target.fam, target.p, { stroke:"rgba(16,185,129,.72)", width:3, dash:[7,6] });
  }
  drawResiduals(fam,p);
  drawCurve(fam, p, { stroke:"#2563eb", width:3 });
  drawPoints();
  updateFormula();
  updateMetric();
}

// ============ events ============
for (const s of sliders) s.addEventListener("input", update);
familySelect.addEventListener("change", update);
document.getElementById("noTrigMode").addEventListener("change", () => {
  populateFamilySelect();
  generateData();
});
document.getElementById("showResiduals").addEventListener("change", update);
document.getElementById("showTarget").addEventListener("change", update);
document.getElementById("newData").addEventListener("click", generateData);
document.getElementById("resetGuess").addEventListener("click", resetGuess);
document.getElementById("toggleAnswer").addEventListener("click", () => {
  const el = document.getElementById("answer");
  el.style.display = (el.style.display === "block") ? "none" : "block";
});
window.addEventListener("resize", update);

generateData();
</script>
